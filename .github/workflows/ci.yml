name: verify

on:
  pull_request:
  push:
    branches: [main, "codex/**"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16.10-bookworm
        env:
          POSTGRES_DB: jarvis_v1_test
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_USER: jarvis_v1_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jarvis_v1_dev -d jarvis_v1_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://jarvis_v1_dev@127.0.0.1:5432/jarvis_v1_test
      DATABASE_URL: postgresql+psycopg://jarvis_v1_dev@127.0.0.1:5432/jarvis_v1_test
      CI: "true"
      JARVIS_REQUIRE_REAL_ENTRYPOINT: "1"
      JARVIS_TEST_ISOLATION_IMAGE: jarvis-v1-verification:local
      JARVIS_TEST_SSH_DIRECTORY: /tmp/jarvis-ci-ssh
      JARVIS_TEST_SSH_CONTAINER: jarvis-v1-ci-protocol-worker
      JARVIS_TEST_SSH_PORT: "22249"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install -e . --no-deps
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - name: Bootstrap PostgreSQL logical roles
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGDATABASE: jarvis_v1_test
          PGUSER: jarvis_v1_dev
        run: psql -v ON_ERROR_STOP=1 -f deploy/postgres/init/001_roles.sql
      - name: Provision mandatory real-entrypoint protocol worker
        run: python -m scripts.provision_runtime_fixture --directory "$JARVIS_TEST_SSH_DIRECTORY"
      - run: scripts/verify.sh
      - name: Remove disposable protocol worker
        if: always()
        run: docker rm -f jarvis-v1-ci-protocol-worker || true
